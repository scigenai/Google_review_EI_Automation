name: Google Reviews Automation

on:
  schedule:
    - cron: '0 18 * * 5'

  workflow_dispatch:

jobs:
  run-script:

    runs-on: ubuntu-latest

    # Raised as a safety margin: across all EI branches, even the sped-up
    # per-branch selectors (see daily.py) plus normal network latency and
    # the randomized 5-15s sleep between branches can add up. 120 minutes
    # gives headroom without approaching GitHub-hosted runners' 360-minute
    # per-job cap.
    timeout-minutes: 120

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        id: install-chrome
        uses: browser-actions/setup-chrome@v1

      # Read the ACTUAL installed Chrome's major version and pass it to
      # daily.py directly (as CHROME_MAJOR_VERSION below). A run's log
      # showed undetected_chromedriver's own auto-detection guessing
      # chromedriver v153 while the real installed Chrome was v152 --
      # reading the version straight from the binary avoids that mismatch.
      - name: Log installed Chrome version
        id: chrome-version
        run: |
          VERSION_STRING=$("${{ steps.install-chrome.outputs.chrome-path }}" --version)
          echo "Installed Chrome: $VERSION_STRING"
          MAJOR_VERSION=$(echo "$VERSION_STRING" | grep -oP '\d+' | head -1)
          echo "Detected major version: $MAJOR_VERSION"
          echo "major-version=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XVFB
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # The actual installed Chrome's major version, read above --
          # daily.py's create_driver() tries this first before falling
          # back to auto-detection / version probing.
          CHROME_MAJOR_VERSION: ${{ steps.chrome-version.outputs.major-version }}

        run: |
          xvfb-run python daily.py
